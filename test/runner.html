<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>EventEmitterExtra Tests</title>

    <!--
        Browser counterpart of test/runner.js: it wires up the globals test/test.js
        expects and then runs the same test file, against the built bundle rather
        than against src.

            npm install && npm run build

        then `npm run serve:browser`, which serves the repository and opens this
        page. Append ?bundle=modern to exercise dist/globals.modern.js instead of
        dist/globals.js.

        test/browser-harness.js supplies describe/it/beforeEach/afterEach, `assert`
        and the reporter, so the only thing loaded out of node_modules is sinon,
        which test/test.js uses for spies and which the Node runners use too.

        Modern browsers only. dist/globals.js is ES5 and still targets IE 11, but
        sinon 22's browser bundle is not, so this page cannot run there -- the
        non-modern bundle's old-browser support is no longer verifiable with this
        toolchain. Pinning an older sinon would drag the 2016 dependency tree back
        in, so the limitation is written down instead of worked around.
    -->

    <style>
        body {
            margin: 0;
            padding: 2rem;
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #24292f;
            background: #fff;
        }

        h1 { font-size: 1.25rem; margin: 0 0 .25rem; }

        .bundle { margin: 0 0 1.5rem; color: #57606a; }
        .bundle code { font-size: .9em; }
        .bundle a { color: #0969da; }

        .summary {
            padding: .75rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid #d0d7de;
        }
        .summary.running { background: #f6f8fa; }
        .summary.pass { background: #dafbe1; border-color: #6fdd8b; }
        .summary.fail { background: #ffebe9; border-color: #ff8182; }

        .results { list-style: none; margin: 1rem 0 0; padding: 0; }

        .test { padding: .25rem 0 .25rem 1.5rem; position: relative; }
        .test::before { position: absolute; left: 0; }
        .test.pass::before { content: "✔"; color: #1a7f37; }
        .test.fail::before { content: "✖"; color: #cf222e; }
        .test.fail { color: #cf222e; }
        .test.skip::before { content: "○"; color: #57606a; }
        .test.skip { color: #57606a; }

        .suite { color: #57606a; }

        .error {
            margin: .5rem 0 .75rem;
            padding: .75rem;
            border-radius: 6px;
            background: #f6f8fa;
            color: #24292f;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .error-box {
            padding: 1rem;
            border: 1px solid #ff8182;
            border-radius: 6px;
            background: #ffebe9;
        }
        .error-box h2 { margin: 0 0 .5rem; font-size: 1rem; }
        .error-box p { margin: .25rem 0; }

        @media (prefers-color-scheme: dark) {
            body { color: #e6edf3; background: #0d1117; }
            .bundle { color: #8d96a0; }
            .bundle a { color: #4493f8; }
            .summary { border-color: #30363d; }
            .summary.running { background: #161b22; }
            .summary.pass { background: #12261e; border-color: #2ea043; }
            .summary.fail { background: #25171c; border-color: #f85149; }
            .test.pass::before { color: #3fb950; }
            .test.fail::before, .test.fail { color: #f85149; }
            .test.skip::before, .test.skip { color: #8d96a0; }
            .suite { color: #8d96a0; }
            .error { background: #161b22; color: #e6edf3; }
            .error-box { background: #25171c; border-color: #f85149; }
        }
    </style>
</head>

<body>
    <h1>EventEmitterExtra Tests</h1>
    <p class="bundle" id="bundle"></p>
    <div id="output"></div>

    <script src="./test-shape.js"></script>
    <script src="./browser-harness.js"></script>
    <script>
        (function() {
            var output = document.getElementById('output');

            // Everything below goes through these two, so if either failed to
            // load the next line would throw and leave the page blank -- the very
            // silence the rest of this file exists to avoid.
            var missingScript = typeof TestShape === 'undefined' ? 'test/test-shape.js' :
                typeof BrowserHarness === 'undefined' ? 'test/browser-harness.js' : null;

            if (missingScript) {
                output.innerHTML = '<div class="error-box"><h2>Could not load ' +
                    missingScript + '</h2><p>Serve this page over HTTP with ' +
                    '<code>npm run serve:browser</code> rather than opening the file ' +
                    'directly.</p></div>';
                return;
            }

            var modern = /[?&]bundle=modern(&|$)/.test(window.location.search);
            var bundle = modern ? 'globals.modern.js' : 'globals.js';

            document.getElementById('bundle').innerHTML = modern ?
                'Testing <code>dist/globals.modern.js</code> — <a href="?">test dist/globals.js</a>' :
                'Testing <code>dist/globals.js</code> — <a href="?bundle=modern">test dist/globals.modern.js</a>';

            // A script that 404s still fires onload in some browsers only after
            // erroring, and a script that throws never reports at all, so surface
            // both rather than letting the page sit silently broken.
            window.onerror = function(message, source, line) {
                BrowserHarness.showError(output, 'Script error', [
                    message,
                    source ? source + ':' + line : ''
                ]);
            };

            function missing(what, remedy) {
                BrowserHarness.showError(output, 'Could not load ' + what, [remedy]);
            }

            BrowserHarness.loadScripts([
                '../node_modules/sinon/pkg/sinon.js',
                '../dist/' + bundle,
                './test.js'
            ], function() {
                if (typeof sinon === 'undefined')
                    return missing('sinon', 'Run `npm install` in the repository root.');
                if (typeof EventEmitterExtra === 'undefined')
                    return missing('dist/' + bundle, 'Run `npm run build` in the repository root.');

                // This handler covered the loading phase only. The harness has
                // its own error listener that attributes failures to a test, and
                // leaving both live reported every async error twice: once
                // attributed, once as an anonymous Script error box.
                window.onerror = null;

                BrowserHarness.run(output);
            }, function(url) {
                var remedy = url.indexOf('node_modules') !== -1 ?
                    'Run `npm install` in the repository root.' :
                    'Run `npm run build` in the repository root.';
                missing(url, remedy);
            });
        })();
    </script>
</body>
</html>
