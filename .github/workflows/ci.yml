name: CI

on:
  push:
    branches: [master]
  pull_request:

# These jobs run pull request code through npm ci, build and test, so the token
# they carry gets no more than it needs to read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolchain floor is c8: ^20.19 || ^22.12 || >=23.
        node: ['20.19', '22.12', '24']
    steps:
      # Without this the token stays in .git/config, where the pull request code
      # these jobs run could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci
      - run: npm run coverage

      # dist/ is committed and published, so a bundle that no longer matches src
      # has to fail here rather than ship.
      - run: npm run build
      - run: git diff --exit-code -- dist

      # Every engine that runs these bundles in CI is modern, so ES2015 syntax
      # landing in dist stays green everywhere -- verified by injecting some.
      # es-check parses all four bundles as ES5 and fails on anything newer.
      - run: npm run check:es5

      # The tarball is the actual deliverable, so its contents are asserted
      # rather than printed. `npm pack --dry-run` always exits 0, so on its own
      # it would keep passing while a widened `files` field shipped test/,
      # node_modules or a stray file, and only the log would show it.
      - name: Check tarball contents
        run: |
          printf '%s\n' \
            README.md \
            dist/commonjs.js dist/commonjs.js.map \
            dist/commonjs.modern.js dist/commonjs.modern.js.map \
            dist/globals.js dist/globals.js.map \
            dist/globals.modern.js dist/globals.modern.js.map \
            index.d.ts package.json | sort > expected-files.txt
          npm pack --dry-run --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].files.map(f=>f.path).join("\n")+"\n"))' \
            | sort > actual-files.txt
          diff expected-files.txt actual-files.txt

  # The same 38 tests, headless in real Chromium via @web/test-runner -- once
  # against dist/globals.js and once against dist/globals.modern.js. This used
  # to be a hand-served page read by eye; now it fails the build.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - run: npm ci

      # Installing with --with-deps took 16m37s of a 17m job (apt on the
      # runner); the tests themselves take seconds. GitHub's Ubuntu images
      # already carry Chrome's system libraries, so only the browser binary is
      # needed, cached across runs and keyed on the Playwright version. If an
      # image ever drops a library, this job fails loudly rather than quietly.
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium

      - run: npm run test:browser
